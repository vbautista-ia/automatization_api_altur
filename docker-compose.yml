version: '3.8'

services:
  back_automatization:
    build:
      context: .
      network: host
    container_name: fastapi_server
    ports:
      - "80:8000"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      - postgres_db
    networks:
      - red_docker
  
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_fastapi
    restart: always
    environment:
      - POSTGRES_USER=${USER_DB}
      - POSTGRES_PASSWORD=${PASS_DB}
      - POSTGRES_DB=${NAME_DB}
    ports:
      - "${PORT_DB}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_docker

networks:
  red_docker:
    driver: bridge
    ipam:
      config:
        - subnet: 10.222.0.0/24

volumes:
  postgres_data:
      